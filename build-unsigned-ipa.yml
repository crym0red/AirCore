name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: airshare-unsigned-ipa-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airshare-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
